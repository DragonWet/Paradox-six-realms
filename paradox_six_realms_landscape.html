<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PARADOX: SIX REALMS — Combat Prototype</title>
<style>
  :root { color-scheme: dark; --panel:rgba(12,18,29,.78); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#09111b; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#f4f7fb; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; z-index:2; background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(8px); }
  #top { top:12px; left:12px; right:12px; padding:10px 12px; display:flex; align-items:center; gap:12px; justify-content:space-between; }
  .brand { font-weight:900; letter-spacing:.08em; font-size:13px; }
  .sub { color:#b7c6d8; font-size:11px; margin-top:2px; }
  .bars { width:min(43vw,230px); }
  .barlabel { display:flex; justify-content:space-between; font-size:10px; margin:3px 0; color:#dce6f2; }
  .bar { height:7px; background:#293443; border-radius:8px; overflow:hidden; }
  .fill { height:100%; width:100%; transition:width .15s; }
  #hpfill { background:linear-gradient(90deg,#d83f4d,#ff8273); }
  #mpfill { background:linear-gradient(90deg,#327ce5,#73d3ff); }
  #objective { position:fixed; z-index:2; top:100px; left:12px; max-width:230px; padding:9px 11px; font-size:12px; line-height:1.45; }
  #objective strong { color:#ffe1a3; }
  #toast { position:fixed; z-index:4; top:45%; left:50%; transform:translate(-50%,-50%); font-weight:800; font-size:18px; text-shadow:0 2px 12px #000; pointer-events:none; opacity:0; transition:opacity .2s; text-align:center; width:90%; }
  #bottom { position:fixed; z-index:3; inset:auto 0 0; height:190px; pointer-events:none; }
  #stickArea { pointer-events:auto; position:absolute; left:22px; bottom:22px; width:120px; height:120px; border:1px solid #ffffff44; background:#07101d66; border-radius:50%; touch-action:none; }
  #stick { position:absolute; width:52px; height:52px; border-radius:50%; left:34px; top:34px; background:#dce9f7bb; border:2px solid #fff9; box-shadow:0 3px 12px #0008; }
  #actions { pointer-events:auto; position:absolute; right:15px; bottom:17px; display:flex; align-items:flex-end; gap:9px; }
  .act { width:60px; height:60px; border-radius:50%; border:1px solid #ffffff66; color:white; font-weight:800; font-size:11px; background:linear-gradient(145deg,#293c57dd,#111c2ddd); box-shadow:0 5px 15px #0006; touch-action:none; }
  .act:active { transform:scale(.94); filter:brightness(1.35); }
  .act.primary { width:70px; height:70px; background:linear-gradient(145deg,#b84b42,#702b36); }
  .act.skill { background:linear-gradient(145deg,#3a6fbc,#21315f); }
  #help { position:fixed; z-index:2; bottom:198px; left:12px; color:#d5e0ee; font-size:10px; text-shadow:0 1px 5px #000; max-width:45%; }
  #reset { position:fixed; z-index:3; top:76px; right:12px; border:1px solid var(--line); background:var(--panel); color:#fff; padding:7px 10px; border-radius:10px; font-size:11px; }
  @media (min-width:800px) { #stickArea { left:36px; bottom:30px; } #actions { right:30px; bottom:28px; } #bottom { height:200px; } #help { bottom:210px; } }
  /* Landscape layout: keep the arena clear and controls anchored to opposite corners. */
  @media (orientation: landscape) and (max-height: 600px) {
    #top { top:8px; left:10px; right:10px; padding:7px 10px; gap:10px; }
    .brand { font-size:12px; }
    .sub { font-size:10px; }
    .bars { width:min(30vw,220px); }
    #objective { top:72px; left:10px; max-width:210px; padding:7px 9px; font-size:11px; }
    #reset { top:8px; right:10px; }
    #bottom { height:125px; }
    #stickArea { left:16px; bottom:12px; width:94px; height:94px; }
    #stick { width:44px; height:44px; left:24px; top:24px; }
    #actions { right:14px; bottom:12px; gap:8px; }
    .act { width:50px; height:50px; font-size:10px; }
    .act.primary { width:58px; height:58px; }
    #help { bottom:132px; left:10px; max-width:38%; font-size:9px; }
    #toast { font-size:16px; }
  }
  @media (orientation: landscape) and (max-height: 420px) {
    #objective { top:64px; font-size:10px; max-width:175px; }
    #bottom { height:100px; }
    #stickArea { width:78px; height:78px; left:12px; bottom:8px; }
    #stick { width:38px; height:38px; left:19px; top:19px; }
    #actions { right:10px; bottom:8px; gap:6px; }
    .act { width:43px; height:43px; }
    .act.primary { width:50px; height:50px; }
    #help { bottom:105px; font-size:8px; }
  }

  @media (orientation: portrait) and (max-width: 900px) {
    #game { }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="top" class="hud">
  <div><div class="brand">PARADOX: SIX REALMS</div><div class="sub">Combat Prototype · Build 0.1</div></div>
  <div class="bars">
    <div class="barlabel"><span>HP</span><span id="hptext">100 / 100</span></div><div class="bar"><div id="hpfill" class="fill"></div></div>
    <div class="barlabel"><span>ENERGY</span><span id="mptext">60 / 60</span></div><div class="bar"><div id="mpfill" class="fill"></div></div>
  </div>
</div>
<div id="objective" class="hud"><strong>OBJECTIVE</strong><br>Latih combat: kalahkan monster latihan.<br><span id="kills">Monster dikalahkan: 0 / 5</span></div>
<button id="reset">Ulangi</button>
<div id="toast"></div>
<div id="help">Joystick: bergerak · ATK: serangan dekat · ROLL: dodge · NOVA: skill area</div>
<div id="bottom">
  <div id="stickArea"><div id="stick"></div></div>
  <div id="actions">
    <button class="act" id="dodge">ROLL</button>
    <button class="act skill" id="skill">NOVA<br><small>20 EN</small></button>
    <button class="act primary" id="attack">ATK</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const THREE = window.THREE;

const root = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa6b7);
scene.fog = new THREE.Fog(0x8aa6b7, 24, 85);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, .1, 150);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xddeeff, 0x293a32, 2.0));
const sun = new THREE.DirectionalLight(0xffe5c1, 2.1);
sun.position.set(-12,22,9); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const mat = (color, roughness=.8, metalness=0) => new THREE.MeshStandardMaterial({color,roughness,metalness});
const groundMat=mat(0x415a4b), stoneMat=mat(0x64717a), darkMat=mat(0x202b3a), goldMat=mat(0xf0b84e,.35,.35);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),groundMat); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(100,50,0x91ad9d,0x526d60); grid.position.y=.012; scene.add(grid);

// Ruined pillars and scattered rocks create a first small arena.
for(let i=0;i<22;i++){
  const a=i/22*Math.PI*2, r=12+(i%3)*2;
  const h=1.5+(i%4)*.65;
  const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.35,.48,h,6),stoneMat);
  pillar.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r); pillar.castShadow=true; pillar.receiveShadow=true; scene.add(pillar);
}
for(let i=0;i<38;i++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+(i%4)*.1,0),stoneMat);
  rock.position.set((Math.random()-.5)*36,.18,(Math.random()-.5)*36);
  rock.rotation.set(Math.random(),Math.random(),Math.random()); rock.castShadow=true; scene.add(rock);
}

function makeHero(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.72,5,8),mat(0x344e78,.55,.15));
  body.position.y=1.15; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),mat(0xe2b996));
  head.position.y=1.95; head.castShadow=true; g.add(head);
  const hood=new THREE.Mesh(new THREE.ConeGeometry(.34,.48,8),mat(0x202d44));
  hood.position.y=2.26; hood.castShadow=true; g.add(hood);
  const blade=new THREE.Mesh(new THREE.BoxGeometry(.12,.85,.18),mat(0xb9d8e8,.25,.7));
  blade.position.set(.55,1.25,-.1); blade.rotation.z=-.35; blade.castShadow=true; g.add(blade);
  const guard=new THREE.Mesh(new THREE.BoxGeometry(.35,.08,.15),goldMat); guard.position.set(.55,.94,-.1); g.add(guard);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.62,.035,6,24),mat(0x79d5ff,.4,.2));
  ring.rotation.x=Math.PI/2; ring.position.y=.05; g.add(ring);
  g.userData.body=body; g.userData.blade=blade;
  return g;
}
const hero=makeHero(); hero.position.set(0,0,4); scene.add(hero);
let hp=100, energy=60, kills=0, attackCd=0, skillCd=0, dodgeTime=0, invuln=0, hitFlash=0;
let move={x:0,y:0}, joyActive=false, joyId=null, joyCenter={x:0,y:0}, lastTime=performance.now();
const enemies=[], effects=[];
function makeEnemy(x,z,index){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.DodecahedronGeometry(.62,1),mat(index%2?0x9b5948:0x7e5148,.8));
  body.position.y=.72; body.castShadow=true; g.add(body);
  const eyeMat=new THREE.MeshBasicMaterial({color:0xffd36c});
  for(const ex of [-.2,.2]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),eyeMat);e.position.set(ex, .85,-.5);g.add(e);}
  const hornMat=mat(0x30262a);
  for(const ex of [-.32,.32]){const h=new THREE.Mesh(new THREE.ConeGeometry(.13,.4,5),hornMat);h.position.set(ex,1.28,0);h.rotation.z=ex<0?.35:-.35;g.add(h);}
  g.position.set(x,0,z); scene.add(g);
  const bar=new THREE.Group();
  const back=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.1),mat(0x261b1b));
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.06),new THREE.MeshBasicMaterial({color:0xe34d51}));
  fill.position.z=.01; bar.add(back,fill); bar.position.y=1.75; g.add(bar);
  const enemy={g,hp:45,maxHp:45,alive:true,attack:0,fill,index}; enemies.push(enemy); return enemy;
}
function spawnWave(){
  for(const e of enemies) scene.remove(e.g);
  enemies.length=0;
  [[3,-5],[-4,-7],[7,1],[-7,2],[2,-11]].forEach((p,i)=>makeEnemy(p[0],p[1],i));
}
spawnWave();

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.style.opacity=0,1400);
}
function updateHud(){
  document.getElementById('hptext').textContent=`${Math.ceil(hp)} / 100`;
  document.getElementById('mptext').textContent=`${Math.ceil(energy)} / 60`;
  document.getElementById('hpfill').style.width=Math.max(0,hp)+'%';
  document.getElementById('mpfill').style.width=Math.max(0,energy/60*100)+'%';
  document.getElementById('kills').textContent=`Monster dikalahkan: ${kills} / 5`;
}
function closestEnemy(maxDist=3.3){
  let best=null, dBest=maxDist;
  for(const e of enemies) if(e.alive){
    const d=hero.position.distanceTo(e.g.position);
    if(d<dBest){best=e;dBest=d;}
  }
  return best;
}
function burst(pos,color=0x75d8ff,scale=1){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.75,wireframe:true}));
  mesh.position.copy(pos); mesh.position.y=Math.max(.5,mesh.position.y); scene.add(mesh);
  effects.push({mesh,life:.42,max:.42,scale});
}
function damageEnemy(e,amount){
  if(!e || !e.alive)return;
  e.hp-=amount; burst(e.g.position.clone().add(new THREE.Vector3(0,1,0)),0xffd36c,.7);
  e.fill.scale.x=Math.max(.001,e.hp/e.maxHp); e.fill.position.x=-(1-e.hp/e.maxHp)*.55;
  if(e.hp<=0){
    e.alive=false; scene.remove(e.g); kills++; energy=Math.min(60,energy+7); updateHud();
    if(kills>=5) toast('Wave selesai! Prototipe combat berhasil.');
    else toast('Monster dikalahkan! +7 Energy');
    if(enemies.every(v=>!v.alive)){setTimeout(()=>{if(kills<5){spawnWave();toast('Gelombang monster baru!');}},900);}
  }
}
function attack(){
  if(attackCd>0)return; attackCd=.42;
  hero.userData.blade.rotation.x=-.7;
  setTimeout(()=>hero.userData.blade.rotation.x=0,130);
  const e=closestEnemy(3.4);
  if(e){damageEnemy(e,18);toast('Hit! -18 HP monster');}
  else toast('Serangan meleset — dekati monster');
}
function castSkill(){
  if(skillCd>0)return;
  if(energy<20){toast('Energy tidak cukup');return;}
  energy-=20;skillCd=4.5;burst(hero.position.clone().add(new THREE.Vector3(0,1,0)),0x62c8ff,2.4);
  let n=0;
  for(const e of enemies)if(e.alive&&hero.position.distanceTo(e.g.position)<5.2){damageEnemy(e,28);n++;}
  toast(n?`NOVA! Mengenai ${n} monster`:'NOVA! Tidak ada monster dalam jangkauan');
  updateHud();
}
function dodge(){
  if(dodgeTime>0)return; dodgeTime=.26; invuln=.32;
  const dir=new THREE.Vector3(move.x,0,move.y);
  if(dir.length()<.1)dir.set(0,0,-1);
  dir.normalize(); hero.position.add(dir.multiplyScalar(2.5)); burst(hero.position.clone(),0xb9eaff,.8);
}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack();});
document.getElementById('skill').addEventListener('pointerdown',e=>{e.preventDefault();castSkill();});
document.getElementById('dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge();});
document.getElementById('reset').addEventListener('click',()=>{
  hp=100;energy=60;kills=0;hero.position.set(0,0,4);spawnWave();updateHud();toast('Arena direset');
});

// Virtual joystick supports touch and mouse.
const area=document.getElementById('stickArea'), knob=document.getElementById('stick');
function setStick(clientX,clientY){
  const r=area.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy; const max=38, len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  const knobBase=(area.clientWidth-52)/2;
   knob.style.left=(knobBase+dx)+'px';knob.style.top=(knobBase+dy)+'px';
  move.x=dx/max;move.y=dy/max;
}
function clearStick(){joyActive=false;joyId=null;move={x:0,y:0};const b=(area.clientWidth-52)/2;knob.style.left=b+'px';knob.style.top=b+'px';}
area.addEventListener('pointerdown',e=>{e.preventDefault();joyActive=true;joyId=e.pointerId;area.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY);});
area.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId){e.preventDefault();setStick(e.clientX,e.clientY);}});
area.addEventListener('pointerup',e=>{if(e.pointerId===joyId)clearStick();});
area.addEventListener('pointercancel',clearStick);

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.04,(now-lastTime)/1000||.016);lastTime=now;
  attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);dodgeTime=Math.max(0,dodgeTime-dt);invuln=Math.max(0,invuln-dt);
  energy=Math.min(60,energy+2.2*dt);
  // Relative movement to camera orientation.
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);forward.y=0;forward.normalize();
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);right.y=0;right.normalize();
  const dir=forward.multiplyScalar(-move.y).add(right.multiplyScalar(move.x));
  if(dir.length()>.08){
    dir.normalize();hero.position.addScaledVector(dir,5.1*dt);
    hero.rotation.y=Math.atan2(dir.x,dir.z);
  }
  hero.position.x=THREE.MathUtils.clamp(hero.position.x,-24,24);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z,-24,24);
  // Enemies slowly approach and attack.
  for(const e of enemies)if(e.alive){
    e.attack-=dt;
    const dx=hero.position.x-e.g.position.x,dz=hero.position.z-e.g.position.z,d=Math.hypot(dx,dz);
    if(d>1.45){e.g.position.x+=dx/d*.85*dt;e.g.position.z+=dz/d*.85*dt;e.g.rotation.y=Math.atan2(dx,dz);}
    else if(e.attack<=0){e.attack=1.65;if(invuln<=0){hp=Math.max(0,hp-7);burst(hero.position.clone().add(new THREE.Vector3(0,1,0)),0xff5656,.6);updateHud();if(hp<=0){toast('Kamu tumbang! Tekan Ulangi');}}}
  }
  for(let i=effects.length-1;i>=0;i--){
    const ef=effects[i];ef.life-=dt;const p=1-ef.life/ef.max;
    ef.mesh.scale.setScalar(1+p*4*ef.scale);ef.mesh.material.opacity=Math.max(0,ef.life/ef.max*.8);
    if(ef.life<=0){scene.remove(ef.mesh);ef.mesh.geometry.dispose();ef.mesh.material.dispose();effects.splice(i,1);}
  }
  const target=new THREE.Vector3(hero.position.x,1.15,hero.position.z);
  const desired=new THREE.Vector3(hero.position.x,6.5,hero.position.z+10);
  camera.position.lerp(desired,.12);camera.lookAt(target);
  updateHud();renderer.render(scene,camera);
}
camera.position.set(0,7,14);camera.lookAt(0,1,0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));});
updateHud();requestAnimationFrame(animate);
</script>
</body>
</html>
